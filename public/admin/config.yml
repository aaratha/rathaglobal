# Decap CMS configuration
# See: https://decapcms.org/docs/configuration-options/
#
# Before going live you must:
#   1. Register a GitHub OAuth App at:
#      https://github.com/settings/developers → New OAuth App
#      - Homepage URL: https://your-site.com
#      - Authorization callback URL: https://your-site.com/admin
#   2. Replace OWNER/REPO below with your GitHub username and repo name.
#   3. Replace YOUR_OAUTH_APP_CLIENT_ID with the Client ID from the OAuth App.

backend:
  name: github
  repo: aaratha/rathaglobal
  branch: main
  base_url: https://decap-proxy.aseemratha.workers.dev
  auth_endpoint: /auth

# Lets the CMS skip GitHub OAuth and talk to a local proxy (run `npx decap-server`)
# when the admin panel is loaded from localhost. Has no effect in production.
local_backend: true

# Saves go to draft branches (cms/<slug>) with a draft -> in review -> ready
# workflow instead of committing straight to main, so unpublished entries can
# be viewed/edited from the "Editorial Workflow" board in the CMS before
# they're published.
publish_mode: editorial_workflow

# Where uploaded images are stored in the repo and served from
media_folder: public/images/blog
public_folder: /images/blog

collections:
  - name: posts
    label: Blog Posts
    label_singular: Post
    folder: src/content/posts
    create: true
    slug: "{{slug}}"
    preview_path: "/blog/{{slug}}"
    fields:
      - name: title
        label: Title
        widget: string

      - name: date
        label: Date
        widget: datetime
        date_format: "YYYY-MM-DD"
        time_format: false
        format: "YYYY-MM-DD"

      - name: description
        label: Description
        widget: string
        hint: "A one-sentence summary shown on the blog index and in search results."

      - name: contributors
        label: Contributors
        widget: string
        required: false
        hint: "Names of the contributors to this publication."

      - name: banner
        label: Banner Photo
        widget: image
        required: false
        hint: "Optional header image shown at the top of the post."

      - name: banner_alt
        label: Banner Accessibility Description
        widget: string
        required: false
        hint: "Describes the banner image for screen readers. Required if a banner is set."

      - name: banner_credit
        label: Banner Credit
        widget: string
        required: false
        hint: "Optional photo credit/attribution shown beneath the banner image."

      - name: pdf
        label: Print PDF
        widget: file
        required: false
        media_folder: /public/documents
        public_folder: /documents
        hint: "Optional print-ready PDF opened when users click Print."

      - name: body
        label: Body
        widget: markdown

  - name: media
    label: In the Media
    label_singular: Media mention
    folder: src/content/media
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{fields.outlet}}"
    identifier_field: outlet
    sortable_fields: ['date', 'outlet']
    fields:
      - name: outlet
        label: Outlet
        widget: string
        hint: "e.g. 'BBC World Service · Business Daily'"

      - name: date
        label: Date
        widget: datetime
        date_format: "YYYY-MM-DD"
        time_format: false
        format: "YYYY-MM-DD"

      - name: title
        label: Title
        widget: string
        required: false

      - name: description
        label: Description
        widget: string
        required: false

      - name: cta
        label: Call to Action
        widget: select
        options: ['Listen', 'Read', 'Watch']
        default: Read

      - name: url
        label: URL
        widget: string
        hint: "External links open in a new tab. A path starting with '/' (e.g. /blog/my-post) stays on site."

      - name: thumbnail
        label: Thumbnail
        widget: image
        required: false
        media_folder: /public/images/media
        public_folder: /images/media
        hint: "Optional. Leave blank to automatically use the linked article's own thumbnail image at build time."
